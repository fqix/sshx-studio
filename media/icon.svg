<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- SSHX Studio: a terminal prompt, and an "X" of two arrows (transfer / forwarding). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#shine)"/>

  <!-- terminal window -->
  <rect x="32" y="48" width="192" height="160" rx="20" fill="#020617" fill-opacity="0.55"/>
  <circle cx="58" cy="74" r="6.5" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="78" cy="74" r="6.5" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="98" cy="74" r="6.5" fill="#ffffff" fill-opacity="0.35"/>

  <!-- prompt: > _ -->
  <g fill="none" stroke="#5eead4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 108 L88 134 L56 160"/>
    <path d="M100 162 H128"/>
  </g>

  <!-- X of two arrows: up-right (upload) and down-right (download) -->
  <g fill="none" stroke="#fbbf24" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 178 L202 104"/>
    <path d="M184 104 H202 V122"/>
    <path d="M148 104 L202 178"/>
    <path d="M202 160 V178 H184"/>
  </g>
</svg>
